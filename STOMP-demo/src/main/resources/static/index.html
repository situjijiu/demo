<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公共聊天室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 800px; height: 90vh; background: #fff; border-radius: 12px; box-shadow: 0 2px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #1677ff; color: #fff; padding: 16px 24px; text-align: center; }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 40px; }
        #login-screen h2 { font-size: 24px; margin-bottom: 8px; color: #333; }
        #login-screen p { color: #999; margin-bottom: 24px; }
        #login-screen input { width: 300px; padding: 12px 16px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        #login-screen input:focus { border-color: #1677ff; }
        #login-screen button { margin-top: 16px; padding: 12px 48px; background: #1677ff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        #login-screen button:hover { background: #4096ff; }
        #chat-screen { display: none; flex-direction: column; flex: 1; }
        .chat-info { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
        .chat-info .user-badge { display: inline-flex; align-items: center; gap: 8px; }
        .chat-info .user-badge .avatar { width: 32px; height: 32px; border-radius: 50%; background: #1677ff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
        .chat-info .status { font-size: 13px; color: #52c41a; }
        .chat-info .status.disconnected { color: #ff4d4f; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 3px; }
        .message { display: flex; flex-direction: column; max-width: 70%; }
        .message.self { align-self: flex-end; align-items: flex-end; }
        .message.other { align-self: flex-start; align-items: flex-start; }
        .message .sender { font-size: 12px; color: #999; margin-bottom: 4px; }
        .message .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .message.self .bubble { background: #1677ff; color: #fff; border-bottom-right-radius: 4px; }
        .message.other .bubble { background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
        .message .time { font-size: 11px; color: #bbb; margin-top: 4px; }
        .system-message { text-align: center; color: #999; font-size: 13px; padding: 4px 0; }
        .input-area { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #f0f0f0; background: #fff; }
        .input-area input { flex: 1; padding: 10px 16px; border: 2px solid #e8e8e8; border-radius: 24px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .input-area input:focus { border-color: #1677ff; }
        .input-area button { width: 40px; height: 40px; border-radius: 50%; background: #1677ff; color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s; flex-shrink: 0; }
        .input-area button:hover { background: #4096ff; }
        .input-area button:disabled { background: #d9d9d9; cursor: not-allowed; }
        .input-area button svg { width: 20px; height: 20px; fill: currentColor; }
        .error-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ff4d4f; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 1000; display: none; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { transform: translateX(-50%) translateY(-20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <!-- 错误提示 -->
    <div id="error-toast" class="error-toast"></div>

    <div class="container">

        <!-- 顶部标题 -->
        <div class="header">
            <h1>💬 公共聊天室</h1>
            <p>基于 STOMP + WebSocket 的实时聊天</p>
        </div>

        <!-- 登录界面 -->
        <div id="login-screen">
            <h2>欢迎加入聊天室</h2>
            <p>请输入你的昵称开始聊天</p>
            <input type="text" id="username-input" placeholder="请输入昵称..." maxlength="20" autofocus>
            <button id="join-btn">加入聊天</button>
        </div>

        <!-- 聊天界面 -->
        <div id="chat-screen">
            <div class="chat-info">
                <div class="user-badge">
                    <div class="avatar" id="user-avatar">U</div>
                    <span id="display-name">用户</span>
                </div>
                <span class="status" id="connection-status">● 已连接</span>
            </div>

            <div class="messages" id="messages-container"></div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="输入消息..." maxlength="500">
                <button id="send-btn" disabled>
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>

    </div>

    <!-- SockJS 和 STOMP 库 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2/cjs/stomp.min.js"></script>

    <script>
        /**
         * 聊天室应用 - 主逻辑
         * 管理 WebSocket 连接、消息收发、UI 交互
         */
        (function() {
            'use strict';

            // --- DOM 元素引用 ---
            const loginScreen = document.getElementById('login-screen');
            const chatScreen = document.getElementById('chat-screen');
            const usernameInput = document.getElementById('username-input');
            const joinBtn = document.getElementById('join-btn');
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const messagesContainer = document.getElementById('messages-container');
            const displayName = document.getElementById('display-name');
            const userAvatar = document.getElementById('user-avatar');
            const connectionStatus = document.getElementById('connection-status');
            const errorToast = document.getElementById('error-toast');

            // --- 状态变量 ---
            let stompClient = null;       // STOMP 客户端实例
            let username = '';            // 当前用户名
            let isConnected = false;      // 连接状态标记

            // --- 工具函数 ---

            /**
             * 显示错误提示（3秒自动消失）
             * @param {string} msg - 错误消息
             */
            function showError(msg) {
                errorToast.textContent = msg;
                errorToast.style.display = 'block';
                setTimeout(() => { errorToast.style.display = 'none'; }, 3000);
            }

            /**
             * 格式化时间为本地时间字符串 (HH:mm)
             * @param {string} timeStr - ISO 时间字符串
             * @returns {string} 格式化后的时间
             */
            function formatTime(timeStr) {
                if (!timeStr) return '';
                try {
                    const d = new Date(timeStr);
                    return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                } catch {
                    return timeStr;
                }
            }

            /**
             * 获取头像首字母
             */
            function getInitial(name) {
                return name ? name.charAt(0).toUpperCase() : 'U';
            }

            // --- 消息渲染 ---

            /**
             * 在聊天区域追加一条消息
             * @param {Object} msg - { sender, message, time }
             */
            function appendMessage(msg) {
                const isSelf = msg.sender === username;
                const div = document.createElement('div');
                div.className = `message ${isSelf ? 'self' : 'other'}`;

                div.innerHTML = `
                    <div class="sender">${escapeHtml(msg.sender)}</div>
                    <div class="bubble">${escapeHtml(msg.message)}</div>
                    <div class="time">${formatTime(msg.time)}</div>
                `;

                messagesContainer.appendChild(div);
                scrollToBottom();
            }

            /**
             * 追加系统消息（如加入/离开提示）
             * @param {string} text - 系统消息文本
             */
            function appendSystemMessage(text) {
                const div = document.createElement('div');
                div.className = 'system-message';
                div.textContent = text;
                messagesContainer.appendChild(div);
                scrollToBottom();
            }

            /**
             * HTML 转义，防止 XSS
             */
            function escapeHtml(text) {
                const el = document.createElement('div');
                el.textContent = text;
                return el.innerHTML;
            }

            /**
             * 滚动到底部
             */
            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            // --- STOMP 连接管理 ---

            /**
             * 建立 STOMP 连接
             */
            function connect() {
                // 创建 SockJS 连接
                const socket = new SockJS('/ws/chat');
                stompClient = Stomp.over(socket);

                // 关闭调试日志
                stompClient.debug = null;

                stompClient.connect({}, function(frame) {
                    isConnected = true;
                    updateConnectionStatus(true);

                    // 订阅公共消息主题
                    stompClient.subscribe('/topic/messages', function(response) {
                        const chatMsg = JSON.parse(response.body);
                        appendMessage(chatMsg);
                    });

                    // 发送用户加入通知
                    stompClient.send('/app/chat', {}, JSON.stringify({
                        sender: '系统',
                        message: username + ' 加入了聊天室',
                        time: new Date().toISOString()
                    }));

                    // 启用发送按钮
                    sendBtn.disabled = false;
                    messageInput.focus();

                }, function(error) {
                    isConnected = false;
                    updateConnectionStatus(false);
                    showError('连接失败，正在重试...');
                    // 3 秒后重连
                    setTimeout(connect, 3000);
                });
            }

            /**
             * 更新连接状态显示
             * @param {boolean} connected - 是否已连接
             */
            function updateConnectionStatus(connected) {
                connectionStatus.textContent = connected ? '● 已连接' : '○ 已断开';
                connectionStatus.className = `status ${connected ? '' : 'disconnected'}`;
            }

            /**
             * 发送消息到服务器
             */
            function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || !stompClient || !isConnected) return;

                // 构造消息对象
                const chatMsg = {
                    sender: username,
                    message: text,
                    time: new Date().toISOString()
                };

                // 通过 STOMP 发送到服务端
                stompClient.send('/app/chat', {}, JSON.stringify(chatMsg));
                messageInput.value = '';
                messageInput.focus();
            }

            // --- 事件绑定 ---

            // 加入聊天
            joinBtn.addEventListener('click', function() {
                const name = usernameInput.value.trim();
                if (!name) {
                    showError('请输入昵称');
                    return;
                }
                username = name;
                displayName.textContent = username;
                userAvatar.textContent = getInitial(username);

                // 切换界面
                loginScreen.style.display = 'none';
                chatScreen.style.display = 'flex';

                // 建立连接
                connect();
            });

            // 回车键加入
            usernameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') joinBtn.click();
            });

            // 发送消息
            sendBtn.addEventListener('click', sendMessage);

            // 回车键发送消息
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') sendMessage();
            });

            // 窗口关闭前断开连接
            window.addEventListener('beforeunload', function() {
                if (stompClient && isConnected) {
                    stompClient.disconnect();
                }
            });

        })();
    </script>

</body>
</html>
