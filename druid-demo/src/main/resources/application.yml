server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://192.168.42.143:3306?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: test_db
    password: JjzBfRJ3ZB5JDLeH
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

    # Druid 连接池配置
    druid:
      # 初始化连接数
      initial-size: 5
      # 最小空闲连接数
      min-idle: 5
      # 最大活跃连接数
      max-active: 20
      # 获取连接等待超时时间(毫秒)
      max-wait: 60000
      # 检测连接是否有效的 SQL
      validation-query: SELECT 1
      # 申请连接时检测，建议 false 开启会影响性能
      test-on-borrow: false
      # 归还连接时检测
      test-on-return: false
      # 空闲时检测
      test-while-idle: true
      # 空闲连接回收器运行间隔(毫秒)
      time-between-eviction-runs-millis: 60000
      # 连接在池中最小生存时间(毫秒)
      min-evictable-idle-time-millis: 300000
      # 是否缓存 PreparedStatement
      pool-prepared-statements: true
      # 缓存 PreparedStatement 数量
      max-pool-prepared-statement-per-connection-size: 20
      # 监控统计拦截器
      filters: stat,wall,slf4j
      # 启用 StatFilter 合并统计
      use-global-data-source-stat: true

      # StatViewServlet 监控页面配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
        allow: ""

      # WebStatFilter 配置
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.css,*.gif,*.jpg,*.png,*.ico,/druid/*"